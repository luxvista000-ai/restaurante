<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante — Cozinha</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:    #1a1410;
  --bg2:   #221c16;
  --card:  #2a2018;
  --card2: #332618;
  --terra: #c4632e;
  --terra2:#e0783a;
  --tdim:  rgba(196,99,46,.15);
  --tring: rgba(196,99,46,.30);
  --ink:   #f0e4d0;
  --muted: #8a7860;
  --border:rgba(196,99,46,.18);
  --border2:rgba(196,99,46,.32);
  --green: #3d9e68;
  --greendim:rgba(61,158,104,.15);
  --amber: #e0a020;
  --ambdim:rgba(224,160,32,.15);
  --red:   #d94040;
  --reddim:rgba(217,64,64,.15);
  --blue:  #4a90d4;
  --bluedim:rgba(74,144,212,.15);
  --sh:    0 4px 20px rgba(0,0,0,.4);
  --sh2:   0 8px 40px rgba(0,0,0,.6);
  --r:     14px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{font-size:15px;}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;font-weight:400;}
button{cursor:pointer;border:none;font-family:'DM Sans',sans-serif;}

/* ── ANIMATIONS ── */
@keyframes slideIn  {from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes popIn    {0%{opacity:0;transform:scale(.88)}65%{transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
@keyframes newPulse {0%{box-shadow:0 0 0 0 rgba(196,99,46,.7)}70%{box-shadow:0 0 0 16px rgba(196,99,46,0)}100%{box-shadow:0 0 0 0 rgba(196,99,46,0)}}
@keyframes urgentPulse{0%,100%{border-color:var(--red)}50%{border-color:rgba(217,64,64,.3)}}
@keyframes fadeIn   {from{opacity:0}to{opacity:1}}
@keyframes ping     {0%{transform:scale(1);opacity:1}75%,100%{transform:scale(2);opacity:0}}
@keyframes timerPulse{0%,100%{color:var(--amber)}50%{color:#fff}}

/* ── TOP BAR ── */
.topbar{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:0 24px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.top-brand h1{font-size:22px;color:var(--terra2);letter-spacing:.05em;}
.top-brand p{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;}
.top-stats{display:flex;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.ts{padding:8px 18px;text-align:center;border-right:1px solid var(--border);}
.ts:last-child{border-right:none;}
.ts-num{font-family:'Cormorant Garamond',serif;font-size:24px;line-height:1;}
.ts-lbl{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.ts.amber .ts-num{color:var(--amber);}
.ts.green .ts-num{color:var(--green);}
.ts.red   .ts-num{color:var(--red);}
.top-right{display:flex;align-items:center;gap:14px;}
.live-badge{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);position:relative;}
.live-dot::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--green);animation:ping 2s infinite;}
.clock-big{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--terra2);letter-spacing:.04em;}

/* ── COLUMNS LAYOUT ── */
.columns{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;padding:16px 20px;height:calc(100vh - 64px);overflow:hidden;}
.col{display:flex;flex-direction:column;gap:10px;overflow:hidden;}
.col-header{display:flex;align-items:center;gap:10px;padding:0 4px;flex-shrink:0;}
.col-icon{font-size:18px;}
.col-title{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;}
.col-count{margin-left:auto;background:var(--card2);border-radius:100px;font-size:11px;font-weight:700;padding:3px 9px;color:var(--muted);}
.col.recebido .col-title{color:var(--amber);}
.col.recebido .col-count{background:var(--ambdim);color:var(--amber);}
.col.preparando .col-title{color:var(--blue);}
.col.preparando .col-count{background:var(--bluedim);color:var(--blue);}
.col.pronto .col-title{color:var(--green);}
.col.pronto .col-count{background:var(--greendim);color:var(--green);}
.col.entregue .col-title{color:var(--muted);}
.col-cards{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.col-cards::-webkit-scrollbar{width:4px;}
.col-cards::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* ── ORDER CARD ── */
.ocard{
  background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);
  overflow:hidden;transition:all .25s;
  animation:popIn .4s cubic-bezier(.16,1,.3,1);
}
.ocard.new-order{border-color:var(--terra);animation:popIn .4s cubic-bezier(.16,1,.3,1),newPulse 2s 0.4s ease;}
.ocard.urgent{border-color:var(--red);animation:popIn .4s cubic-bezier(.16,1,.3,1),urgentPulse 1.2s infinite;}
.ocard:hover{border-color:var(--border2);box-shadow:var(--sh);}

.oc-head{
  background:var(--card2);padding:11px 14px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.oc-table-wrap{display:flex;flex-direction:column;}
.oc-table{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--terra2);line-height:1;}
.oc-id{font-size:10px;color:var(--muted);letter-spacing:.08em;margin-top:1px;}
.oc-timer{
  text-align:right;font-size:12px;font-weight:700;
  display:flex;flex-direction:column;align-items:flex-end;gap:2px;
}
.timer-val{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--ink);}
.timer-val.warn{color:var(--amber);animation:timerPulse 1.5s infinite;}
.timer-val.urgent{color:var(--red);animation:timerPulse .8s infinite;}
.timer-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}

.oc-items{padding:12px 14px;display:flex;flex-direction:column;gap:6px;}
.oc-item{display:flex;align-items:flex-start;gap:8px;}
.oc-item.done .item-name{text-decoration:line-through;color:var(--muted);opacity:.6;}
.oc-qty-box{
  background:var(--terra);color:#fff;
  border-radius:6px;width:22px;height:22px;min-width:22px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;flex-shrink:0;margin-top:1px;
}
.item-name{font-size:13px;font-weight:500;color:var(--ink);line-height:1.35;flex:1;}
.item-check{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border2);background:none;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;transition:all .15s;color:transparent;}
.item-check:hover{border-color:var(--green);color:var(--green);}
.item-check.done{background:var(--green);border-color:var(--green);color:#fff;}

.oc-divider{height:1px;background:var(--border);margin:0 14px;}

.oc-foot{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.oc-source{font-size:10px;color:var(--muted);letter-spacing:.06em;}
.oc-btns{display:flex;gap:6px;}
.oc-btn{padding:7px 13px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.04em;transition:all .18s;}
.oc-btn:active{transform:scale(.96);}
.btn-start{background:var(--ambdim);color:var(--amber);border:1px solid rgba(224,160,32,.25);}
.btn-start:hover{background:var(--ambdim);border-color:var(--amber);}
.btn-done{background:var(--greendim);color:var(--green);border:1px solid rgba(61,158,104,.25);}
.btn-done:hover{background:rgba(61,158,104,.22);border-color:var(--green);}
.btn-deliver{background:var(--bluedim);color:var(--blue);border:1px solid rgba(74,144,212,.25);}
.btn-deliver:hover{background:rgba(74,144,212,.22);border-color:var(--blue);}

/* ── EMPTY COL ── */
.col-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:8px;opacity:.4;}
.col-empty-icon{font-size:32px;}
.col-empty p{font-size:12px;text-align:center;}

/* ── SOUND TOGGLE ── */
.sound-btn{background:var(--card2);border:1px solid var(--border);color:var(--muted);padding:7px 13px;border-radius:8px;font-size:12px;transition:all .2s;}
.sound-btn.on{border-color:var(--green);color:var(--green);}

/* ── NEW ORDER ALERT ── */
.alert-banner{
  position:fixed;top:72px;left:50%;transform:translateX(-50%);
  background:var(--terra);color:#fff;
  padding:12px 24px;border-radius:12px;
  font-size:14px;font-weight:700;letter-spacing:.04em;
  box-shadow:0 8px 32px rgba(196,99,46,.5);
  animation:popIn .4s cubic-bezier(.16,1,.3,1);
  z-index:200;display:flex;align-items:center;gap:10px;
}

/* ── DEMO INJECT (for testing) ── */
.demo-btn{background:var(--card2);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;transition:all .2s;}
.demo-btn:hover{border-color:var(--terra);color:var(--terra);}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="top-brand">
    <h1>Restaurante</h1>
    <p>Display de Cozinha</p>
  </div>
  <div class="top-stats">
    <div class="ts amber">
      <div class="ts-num" id="cnt-recebido">0</div>
      <div class="ts-lbl">Novos</div>
    </div>
    <div class="ts" style="color:var(--blue)">
      <div class="ts-num" style="color:var(--blue)" id="cnt-preparando">0</div>
      <div class="ts-lbl">Em prep.</div>
    </div>
    <div class="ts green">
      <div class="ts-num" id="cnt-pronto">0</div>
      <div class="ts-lbl">Prontos</div>
    </div>
    <div class="ts">
      <div class="ts-num" id="cnt-entregue">0</div>
      <div class="ts-lbl">Entregues</div>
    </div>
  </div>
  <div class="top-right">
    <button class="demo-btn" onclick="injectDemoOrder()">+ Pedido Demo</button>
    <button class="sound-btn on" id="soundBtn" onclick="toggleSound()">🔔 Som</button>
    <div class="live-badge">
      <div class="live-dot"></div>
      <span>Ligado</span>
    </div>
    <div class="clock-big" id="clock">--:--:--</div>
  </div>
</div>

<!-- KANBAN COLUMNS -->
<div class="columns">
  <!-- RECEBIDO -->
  <div class="col recebido">
    <div class="col-header">
      <span class="col-icon">📥</span>
      <span class="col-title">Recebido</span>
      <span class="col-count" id="badge-recebido">0</span>
    </div>
    <div class="col-cards" id="col-recebido"></div>
  </div>
  <!-- PREPARANDO -->
  <div class="col preparando">
    <div class="col-header">
      <span class="col-icon">🔥</span>
      <span class="col-title">Em Preparação</span>
      <span class="col-count" id="badge-preparando">0</span>
    </div>
    <div class="col-cards" id="col-preparando"></div>
  </div>
  <!-- PRONTO -->
  <div class="col pronto">
    <div class="col-header">
      <span class="col-icon">✅</span>
      <span class="col-title">Pronto para Servir</span>
      <span class="col-count" id="badge-pronto">0</span>
    </div>
    <div class="col-cards" id="col-pronto"></div>
  </div>
  <!-- ENTREGUE -->
  <div class="col entregue">
    <div class="col-header">
      <span class="col-icon">🍽️</span>
      <span class="col-title">Entregue</span>
      <span class="col-count" id="badge-entregue">0</span>
    </div>
    <div class="col-cards" id="col-entregue"></div>
  </div>
</div>

<!-- DEMO NAVIGATION PILL -->
<style>
.demo-nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);backdrop-filter:blur(10px);padding:10px 20px;border-radius:100px;box-shadow:0 8px 30px rgba(0,0,0,.15);display:flex;gap:15px;z-index:999;border:1px solid rgba(0,0,0,.05); align-items:center;}
.demo-nav a{text-decoration:none;font-size:12px;font-weight:700;color:var(--bg2);padding:6px 12px;border-radius:20px;transition:all .2s;}
.demo-nav a:hover{background:var(--terra);color:#fff;}
</style>
<div class="demo-nav">
  <span style="font-size:11px;color:rgba(0,0,0,.5);text-transform:uppercase;letter-spacing:.1em">Apps Ligadas:</span>
  <a href="restaurantefinal.html">Site Cliente V2</a>
  <a href="recepcaofinal.html">App Receção</a>
  <a href="cozinhafinal.html" style="background:var(--terra);color:#fff">App Cozinha</a>
</div>

<script>
/* ════════════════════════════════
   STORAGE (shared with receção)
════════════════════════════════ */
const KEYS = { orders:'rest_orders', tables:'rest_tables' };

let orders = [];
let tables = {};
let soundOn = true;
let knownIds = new Set();
let itemDone = {}; // {orderId: Set(itemIndex)}
let timerInterval;

/* ════════════════════════════════
   INIT
════════════════════════════════ */
function init(){
  loadData();
  renderAll();
  updateClock();
  setInterval(updateClock, 1000);
  setInterval(poll, 1500);
  setInterval(updateTimers, 30000);
}

function loadData(){
  try {
    const o = localStorage.getItem(KEYS.orders);
    const t = localStorage.getItem(KEYS.tables);
    if(o) orders = JSON.parse(o);
    if(t) tables = JSON.parse(t);
  } catch(e){}
}

function saveData(){
  localStorage.setItem(KEYS.orders, JSON.stringify(orders));
  localStorage.setItem(KEYS.tables, JSON.stringify(tables));
}

let lastOrderCount = 0;
function poll(){
  loadData();
  // detect new orders
  const newOnes = orders.filter(o=>!knownIds.has(o.id)&&o.status==='recebido');
  newOnes.forEach(o=>{
    knownIds.add(o.id);
    showAlert(`🛒 Novo pedido — Mesa ${o.table}!`);
    if(soundOn) playBeep();
  });
  orders.forEach(o=>knownIds.add(o.id));
  renderAll();
}

/* ════════════════════════════════
   RENDER
════════════════════════════════ */
function renderAll(){
  const statuses = ['recebido','preparando','pronto','entregue'];
  statuses.forEach(s=>{
    const col = document.getElementById('col-'+s);
    const list = orders.filter(o=>o.status===s).sort((a,b)=>a.created-b.created);
    document.getElementById('badge-'+s).textContent = list.length;
    document.getElementById('cnt-'+s).textContent = list.length;
    if(list.length===0){
      const labels = {recebido:'Aguardando pedidos…',preparando:'Nenhum prato em curso',pronto:'Nenhum prato pronto',entregue:'Nenhum entregue ainda'};
      col.innerHTML=`<div class="col-empty"><div class="col-empty-icon">${s==='recebido'?'📭':s==='preparando'?'👨‍🍳':s==='pronto'?'🔔':'✓'}</div><p>${labels[s]}</p></div>`;
      return;
    }
    // Only re-render cards that changed, to preserve item-done states
    const existing = new Set([...col.querySelectorAll('[data-id]')].map(el=>el.dataset.id));
    const newIds = new Set(list.map(o=>o.id));
    // Remove cards no longer in this status
    [...col.querySelectorAll('[data-id]')].forEach(el=>{ if(!newIds.has(el.dataset.id)) el.remove(); });
    // Add new cards
    list.forEach(o=>{
      if(!existing.has(o.id) || col.querySelector(`[data-id="${o.id}"]`)===null){
        const el = buildCard(o);
        col.appendChild(el);
      }
    });
    // Remove ghost empty states
    col.querySelectorAll('.col-empty').forEach(e=>e.remove());
  });
}

function buildCard(o){
  const wrap = document.createElement('div');
  const mins = Math.round((Date.now()-o.created)/60000);
  const isNew = mins<2 && o.status==='recebido';
  const isUrgent = mins>15 && o.status!=='entregue';
  wrap.className = 'ocard'+(isNew?' new-order':'')+(isUrgent?' urgent':'');
  wrap.dataset.id = o.id;
  wrap.dataset.created = o.created;

  const done = itemDone[o.id] || new Set();
  const tableLabel = o.table==='takeaway'?'🥡 Takeaway':`🪑 Mesa ${o.table}`;
  const timerClass = mins>15?'urgent':mins>8?'warn':'';

  wrap.innerHTML = `
    <div class="oc-head">
      <div class="oc-table-wrap">
        <div class="oc-table">${tableLabel}</div>
        <div class="oc-id">#${o.id.slice(-5).toUpperCase()}</div>
      </div>
      <div class="oc-timer">
        <div class="timer-val ${timerClass}" data-created="${o.created}" id="timer-${o.id}">${mins<1?'<1':mins}min</div>
        <div class="timer-lbl">aguarda</div>
      </div>
    </div>
    <div class="oc-items">
      ${o.items.map((item,i)=>`
        <div class="oc-item ${done.has(i)?'done':''}" id="item-${o.id}-${i}">
          <div class="oc-qty-box">${item.qty}</div>
          <span class="item-name">${item.name}</span>
          <button class="item-check ${done.has(i)?'done':''}" onclick="toggleItem('${o.id}',${i})" title="Marcar feito">✓</button>
        </div>`).join('')}
    </div>
    <div class="oc-divider"></div>
    <div class="oc-foot">
      <span class="oc-source">${o.type==='takeaway'?'🥡 Takeaway':'🌐 Online'}</span>
      <div class="oc-btns">
        ${o.status==='recebido'?`<button class="oc-btn btn-start" onclick="advance('${o.id}','preparando')">🔥 Iniciar</button>`:''}
        ${o.status==='preparando'?`<button class="oc-btn btn-done" onclick="advance('${o.id}','pronto')">✅ Pronto</button>`:''}
        ${o.status==='pronto'?`<button class="oc-btn btn-deliver" onclick="advance('${o.id}','entregue')">🍽️ Entregue</button>`:''}
      </div>
    </div>`;
  return wrap;
}

function toggleItem(orderId, idx){
  if(!itemDone[orderId]) itemDone[orderId]=new Set();
  const s=itemDone[orderId];
  s.has(idx)?s.delete(idx):s.add(idx);
  // Update just the item UI
  const itemEl = document.getElementById(`item-${orderId}-${idx}`);
  const checkEl = itemEl?.querySelector('.item-check');
  if(itemEl) itemEl.classList.toggle('done',s.has(idx));
  if(checkEl) checkEl.classList.toggle('done',s.has(idx));
}

/* ════════════════════════════════
   ACTIONS
════════════════════════════════ */
function advance(id, status){
  const o = orders.find(x=>x.id===id); if(!o) return;
  o.status = status;
  if(status==='entregue' && o.table!=='takeaway'){
    tables[o.table]='free';
  }
  saveData();
  renderAll();
  if(status==='pronto' && soundOn) playDing();
}

/* ════════════════════════════════
   DEMO ORDER INJECTION
════════════════════════════════ */
const DEMO_ITEMS = [
  [{qty:1,name:'Bife de Novilho 250g'},{qty:2,name:'Caldo Verde'},{qty:2,name:'Vinho Natural — Copo'}],
  [{qty:2,name:'Calamares Crocantes'},{qty:1,name:'Bacalhau à Brás'},{qty:1,name:'Robalo na Grelha'}],
  [{qty:3,name:'Croquetes da Casa'},{qty:1,name:'Picanha Grelhada'},{qty:3,name:'Cerveja Artesanal'}],
  [{qty:1,name:'Risotto de Cogumelos'},{qty:1,name:'Shawarma de Grão‑de‑Bico'},{qty:2,name:'Limonada da Casa'}],
  [{qty:2,name:'Carpaccio de Novilho'},{qty:2,name:'Costeletas de Borrego'},{qty:1,name:'Bolo de Chocolate'}],
];
let demoTableIdx = 1;
function injectDemoOrder(){
  const items = DEMO_ITEMS[Math.floor(Math.random()*DEMO_ITEMS.length)];
  const table = demoTableIdx<=15?demoTableIdx:'takeaway';
  demoTableIdx = demoTableIdx>=15?1:demoTableIdx+1;
  const total = items.reduce((s,i)=>s+i.qty*8.5,0);
  const o = {
    id: Math.random().toString(36).slice(2,10)+Date.now().toString(36),
    table: String(table), type:'online',
    items, total, status:'recebido',
    created: Date.now()
  };
  orders.unshift(o);
  if(o.table!=='takeaway') tables[o.table]='occupied';
  saveData();
  renderAll();
  showAlert(`🛒 Novo pedido — ${o.table==='takeaway'?'Takeaway':'Mesa '+o.table}!`);
  if(soundOn) playBeep();
}

/* ════════════════════════════════
   SOUND
════════════════════════════════ */
function toggleSound(){
  soundOn=!soundOn;
  const btn=document.getElementById('soundBtn');
  btn.textContent=soundOn?'🔔 Som':'🔕 Mudo';
  btn.classList.toggle('on',soundOn);
}

function playBeep(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [440,550,660].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=f;g.gain.setValueAtTime(.3,ctx.currentTime+i*.12);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.12+.15);
      o.start(ctx.currentTime+i*.12);o.stop(ctx.currentTime+i*.12+.15);
    });
  }catch(e){}
}
function playDing(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.value=880;o.type='sine';
    g.gain.setValueAtTime(.4,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.6);
    o.start();o.stop(ctx.currentTime+.6);
  }catch(e){}
}

/* ════════════════════════════════
   ALERT BANNER
════════════════════════════════ */
let alertTimeout;
function showAlert(msg){
  const existing=document.querySelector('.alert-banner');
  if(existing) existing.remove();
  const el=document.createElement('div');
  el.className='alert-banner'; el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(alertTimeout);
  alertTimeout=setTimeout(()=>el.remove(),4000);
}

/* ════════════════════════════════
   CLOCK + TIMERS
════════════════════════════════ */
function updateClock(){
  document.getElementById('clock').textContent=
    new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  // update timers
  document.querySelectorAll('[id^="timer-"]').forEach(el=>{
    const created=parseInt(el.dataset.created||el.closest('[data-created]')?.dataset.created);
    if(!created) return;
    const mins=Math.round((Date.now()-created)/60000);
    el.textContent=(mins<1?'<1':mins)+'min';
    el.className='timer-val'+(mins>15?' urgent':mins>8?' warn':'');
  });
}
